name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend — Lint & Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: peblo_tv_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Lint with ruff
        run: |
          cd backend
          python -m ruff check .

      - name: Run tests
        env:
          DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/peblo_tv_test
          DATABASE_URL_SYNC: postgresql://test:test@localhost:5432/peblo_tv_test
          JWT_SECRET: test-secret
          STORAGE_BACKEND: local
          STORAGE_LOCAL_PATH: ./test_storage
          SEED_ON_STARTUP: "false"
        run: |
          cd backend
          python -m pytest -v --tb=short

  frontend-cms:
    name: CMS — Lint & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install & build
        run: |
          cd cms
          npm ci
          npm run lint
          npm run build

  frontend-viewer:
    name: Viewer — Lint & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install & build
        run: |
          cd viewer
          npm ci
          npm run lint
          npm run build

  docker:
    name: Docker — Build Images
    runs-on: ubuntu-latest
    needs: [backend, frontend-cms, frontend-viewer]
    steps:
      - uses: actions/checkout@v4
      - name: Build all images
        run: docker compose build

  # Deploy step — written and explained, doesn't need a real cloud target.
  # In production, this would:
  # 1. Authenticate to the container registry (ECR/GCR/Docker Hub)
  # 2. Push the built images with the commit SHA as tag
  # 3. Run database migrations (alembic upgrade head)
  # 4. Update the service definitions (ECS task definition / Cloud Run revision)
  # 5. Canary deploy: route 10% traffic to new version
  # 6. Wait 5 minutes, check /health endpoint
  # 7. If healthy, shift remaining 90% traffic
  # 8. If unhealthy, rollback to previous revision
  deploy:
    name: Deploy (dry-run)
    runs-on: ubuntu-latest
    needs: [docker]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - name: Deploy step (explained)
        run: |
          echo "=== DEPLOY PLAN ==="
          echo "1. Push images to registry: docker push registry.example.com/peblo-api:$GITHUB_SHA"
          echo "2. Run migrations: alembic upgrade head"
          echo "3. Update ECS/Cloud Run service"
          echo "4. Canary deploy with traffic shifting"
          echo "5. Health check: GET /health"
          echo "6. Full rollout on success, rollback on failure"
          echo "=== DRY RUN COMPLETE ==="
